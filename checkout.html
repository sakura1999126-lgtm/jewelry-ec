<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - West Tokyo Jewels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500&family=Shippori+Mincho:wght@400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="checkout-container">
        <header class="checkout-header">
            <a href="/" class="checkout-logo-link">
                <img src="/public/images/IMG_7300.png" alt="WEST TOKYO JEWELS" class="checkout-logo-img">
            </a>
            <a href="/" class="back-link">← ホームに戻る</a>
        </header>

        <main class="checkout-main">
            <div class="checkout-content">
                <!-- Order Summary -->
                <section class="checkout-cart-section">
                    <h2>注文内容</h2>
                    <div class="checkout-items" id="checkoutItems">
                        <!-- Cart items are dynamically generated by JavaScript -->
                    </div>
                    <div class="checkout-summary">
                        <div class="summary-row">
                            <span>小計:</span>
                            <span id="checkoutSubtotal">¥0</span>
                        </div>
                        <div class="summary-row">
                            <span>送料:</span>
                            <span id="checkoutShipping">¥0</span>
                        </div>
                        <div class="summary-row total">
                            <span>合計:</span>
                            <span id="checkoutTotal">¥0</span>
                        </div>
                    </div>
                </section>

                <!-- Stripe Payment Form (Placeholder) -->
                <section class="checkout-payment-section">
                    <h2>お支払い情報</h2>
                    <div class="stripe-placeholder" id="stripePlaceholder">
                        <p>Stripe決済フォームはここに統合されます</p>
                        <div class="stripe-info">
                            <p>Stripe Checkout Sessionは以下のように実装されます:</p>
                            <ul>
                                <li>Stripe.js SDKを読み込む</li>
                                <li>Checkout Sessionを作成（/api/checkoutエンドポイント経由）</li>
                                <li>Stripe Checkoutへリダイレクト</li>
                                <li>決済完了を処理</li>
                            </ul>
                        </div>
                        <button class="stripe-test-btn" id="stripeTestBtn" disabled>
                            Stripe決済に進む（準備中）
                        </button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        // Checkout page specific script
        document.addEventListener('DOMContentLoaded', () => {
            // Get cart data from local storage
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            
            if (cart.length === 0) {
                window.location.href = '/';
                return;
            }

            // Display cart items
            const checkoutItems = document.getElementById('checkoutItems');
            let subtotal = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;

                const itemElement = document.createElement('div');
                itemElement.className = 'checkout-item';
                itemElement.innerHTML = `
                    <div class="checkout-item-image">
                        <img src="${item.image}" alt="${item.name}">
                    </div>
                    <div class="checkout-item-details">
                        <h3>${item.name}</h3>
                        <p>数量: ${item.quantity}</p>
                        <p class="checkout-item-price">¥${itemTotal.toLocaleString()}</p>
                    </div>
                `;
                checkoutItems.appendChild(itemElement);
            });

            // Calculate and display total
            const shipping = 0; // Shipping can be configured later
            const total = subtotal + shipping;

            document.getElementById('checkoutSubtotal').textContent = `¥${subtotal.toLocaleString()}`;
            document.getElementById('checkoutShipping').textContent = `¥${shipping.toLocaleString()}`;
            document.getElementById('checkoutTotal').textContent = `¥${total.toLocaleString()}`;
        });
    </script>
</body>
</html>
