<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - West Tokyo Jewels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500&family=Shippori+Mincho:wght@400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="checkout-container">
        <header class="checkout-header">
            <a href="/" class="checkout-logo-link">
                <img src="/images/IMG_7300.png" alt="WEST TOKYO JEWELS" class="checkout-logo-img">
            </a>
            <a href="/" class="back-link">← ホームに戻る</a>
        </header>

        <main class="checkout-main">
            <div class="checkout-content">
                <!-- Order Summary -->
                <section class="checkout-cart-section">
                    <h2>注文内容</h2>
                    <div class="checkout-items" id="checkoutItems">
                        <!-- Cart items are dynamically generated by JavaScript -->
                    </div>
                    <div class="checkout-summary">
                        <div class="summary-row">
                            <span>小計:</span>
                            <span id="checkoutSubtotal">¥0</span>
                        </div>
                        <div class="summary-row">
                            <span>送料:</span>
                            <span id="checkoutShipping">¥0</span>
                        </div>
                        <div class="summary-row total">
                            <span>合計:</span>
                            <span id="checkoutTotal">¥0</span>
                        </div>
                    </div>
                </section>

                <!-- Customer Information Form -->
                <section class="checkout-form-section">
                    <h2>お客様情報</h2>
                    <form id="checkoutForm" class="checkout-form">
                        <div class="form-group">
                            <label for="customerName">お名前 <span class="required">*</span></label>
                            <input type="text" id="customerName" name="customerName" required>
                        </div>
                        <div class="form-group">
                            <label for="customerEmail">メールアドレス <span class="required">*</span></label>
                            <input type="email" id="customerEmail" name="customerEmail" required>
                        </div>
                        <div class="form-group">
                            <label for="customerPhone">電話番号 <span class="required">*</span></label>
                            <input type="tel" id="customerPhone" name="customerPhone" required>
                        </div>
                        <div class="form-group">
                            <label for="shippingAddress">配送先住所 <span class="required">*</span></label>
                            <textarea id="shippingAddress" name="shippingAddress" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="checkout-submit-btn" id="checkoutSubmitBtn">
                            注文を確定する
                        </button>
                    </form>
                </section>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        // Checkout page specific script
        document.addEventListener('DOMContentLoaded', async () => {
            // Get cart data from local storage
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            
            if (cart.length === 0) {
                window.location.href = '/';
                return;
            }

            // Display cart items
            const checkoutItems = document.getElementById('checkoutItems');
            let subtotal = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;

                const itemElement = document.createElement('div');
                itemElement.className = 'checkout-item';
                const imageHtml = item.image && !item.image.includes('placeholder.com')
                    ? `<img src="${item.image}" alt="${item.name}" onerror="this.style.display='none';">`
                    : '';
                itemElement.innerHTML = `
                    <div class="checkout-item-image">
                        ${imageHtml}
                    </div>
                    <div class="checkout-item-details">
                        <h3>${item.name}</h3>
                        <p>数量: ${item.quantity}</p>
                        <p class="checkout-item-price">¥${itemTotal.toLocaleString()}</p>
                    </div>
                `;
                checkoutItems.appendChild(itemElement);
            });

            // Calculate and display total
            const shipping = 0; // Shipping can be configured later
            const total = subtotal + shipping;

            document.getElementById('checkoutSubtotal').textContent = `¥${subtotal.toLocaleString()}`;
            document.getElementById('checkoutShipping').textContent = `¥${shipping.toLocaleString()}`;
            document.getElementById('checkoutTotal').textContent = `¥${total.toLocaleString()}`;

            // フォーム送信処理
            const checkoutForm = document.getElementById('checkoutForm');
            const checkoutSubmitBtn = document.getElementById('checkoutSubmitBtn');
            
            checkoutForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // ボタンを無効化
                checkoutSubmitBtn.disabled = true;
                checkoutSubmitBtn.textContent = '処理中...';
                
                try {
                    // 注文データを作成
                    const orderData = {
                        customer_name: document.getElementById('customerName').value,
                        customer_email: document.getElementById('customerEmail').value,
                        customer_phone: document.getElementById('customerPhone').value,
                        shipping_address: document.getElementById('shippingAddress').value,
                        total_amount: total,
                        items: cart.map(item => ({
                            product_id: item.id,
                            product_name: item.name,
                            product_price: item.price,
                            quantity: item.quantity,
                            size_name: item.size_name || null
                        }))
                    };
                    
                    // 注文番号を生成
                    const orderNumber = `ORD-${Date.now()}-${Math.random().toString(36).substr(2, 9).toUpperCase()}`;
                    
                    // 注文データに注文番号を追加
                    orderData.order_number = orderNumber;
                    orderData.created_at = new Date().toISOString();
                    
                    // ローカルストレージに注文を保存（履歴として）
                    const existingOrders = JSON.parse(localStorage.getItem('orders') || '[]');
                    existingOrders.push(orderData);
                    localStorage.setItem('orders', JSON.stringify(existingOrders));
                    
                    // カートをクリア
                    localStorage.removeItem('cart');
                    
                    // 注文完了ページにリダイレクト
                    window.location.href = `/checkout-success.html?order=${orderNumber}`;
                    
                } catch (error) {
                    console.error('注文エラー:', error);
                    alert(`注文の処理中にエラーが発生しました: ${error.message}`);
                    checkoutSubmitBtn.disabled = false;
                    checkoutSubmitBtn.textContent = '注文を確定する';
                }
            });
        });
    </script>
</body>
</html>
