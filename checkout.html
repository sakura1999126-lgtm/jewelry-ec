<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - West Tokyo Jewels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500&family=Shippori+Mincho:wght@400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="checkout-container">
        <header class="checkout-header">
            <a href="/" class="checkout-logo-link">
                <img src="/images/IMG_7300.png" alt="WEST TOKYO JEWELS" class="checkout-logo-img">
            </a>
            <a href="/" class="back-link">← ホームに戻る</a>
        </header>

        <main class="checkout-main">
            <div class="checkout-content">
                <!-- Order Summary -->
                <section class="checkout-cart-section">
                    <h2>注文内容</h2>
                    <div class="checkout-items" id="checkoutItems">
                        <!-- Cart items are dynamically generated by JavaScript -->
                    </div>
                    <div class="checkout-summary">
                        <div class="summary-row">
                            <span>小計:</span>
                            <span id="checkoutSubtotal">¥0</span>
                        </div>
                        <div class="summary-row">
                            <span>送料:</span>
                            <span id="checkoutShipping">¥0</span>
                        </div>
                        <div class="summary-row total">
                            <span>合計:</span>
                            <span id="checkoutTotal">¥0</span>
                        </div>
                    </div>
                </section>

                <!-- Payment Section -->
                <section class="checkout-payment-section">
                    <h2>お支払い</h2>
                    <p style="color: rgba(255, 255, 255, 0.7); margin-bottom: 2rem; line-height: 1.8; text-align: center; font-size: 0.95rem;">
                        決済情報・配送先情報は<br>
                        次のページで入力していただきます
                    </p>
                    <button type="button" class="checkout-submit-btn" id="stripeCheckoutBtn">
                        Stripe Checkoutに進む
                    </button>
                </section>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        // Checkout page specific script
        document.addEventListener('DOMContentLoaded', async () => {
            // Get cart data from local storage
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            
            if (cart.length === 0) {
                window.location.href = '/';
                return;
            }

            // Display cart items
            const checkoutItems = document.getElementById('checkoutItems');
            let subtotal = 0;

            // 商品データを取得して画像情報を補完
            fetch('/api/products')
                .then(res => res.json())
                .then(products => {
                    cart.forEach(item => {
                        const itemTotal = item.price * item.quantity;
                        subtotal += itemTotal;

                        // 商品データから画像を取得
                        const product = products.find(p => p.id === item.id);
                        let imageUrl = item.image || (product && product.image) || '';
                        
                        // プレースホルダーを除外
                        if (imageUrl.includes('placeholder.com')) {
                            imageUrl = '';
                        }

                        const itemElement = document.createElement('div');
                        itemElement.className = 'checkout-item';
                        
                        const imageHtml = imageUrl && !imageUrl.includes('placeholder.com')
                            ? `<img src="${imageUrl}" alt="${item.name}" onerror="this.style.display='none';">`
                            : '<div style="width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 2rem;">📦</div>';
                        
                        itemElement.innerHTML = `
                            <div class="checkout-item-image">
                                ${imageHtml}
                            </div>
                            <div class="checkout-item-details">
                                <h3>${item.name}</h3>
                                <p>数量: ${item.quantity}</p>
                                <p class="checkout-item-price">¥${itemTotal.toLocaleString()}</p>
                            </div>
                        `;
                        checkoutItems.appendChild(itemElement);
                    });

                    // Calculate and display total
                    const shipping = 0;
                    const total = subtotal + shipping;

                    document.getElementById('checkoutSubtotal').textContent = `¥${subtotal.toLocaleString()}`;
                    document.getElementById('checkoutShipping').textContent = `¥${shipping.toLocaleString()}`;
                    document.getElementById('checkoutTotal').textContent = `¥${total.toLocaleString()}`;
                })
                .catch(error => {
                    console.error('商品データの取得に失敗しました:', error);
                    // エラーの場合は画像なしで表示
                    cart.forEach(item => {
                        const itemTotal = item.price * item.quantity;
                        subtotal += itemTotal;

                        const itemElement = document.createElement('div');
                        itemElement.className = 'checkout-item';
                        itemElement.innerHTML = `
                            <div class="checkout-item-image">
                                <div style="width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 2rem;">📦</div>
                            </div>
                            <div class="checkout-item-details">
                                <h3>${item.name}</h3>
                                <p>数量: ${item.quantity}</p>
                                <p class="checkout-item-price">¥${itemTotal.toLocaleString()}</p>
                            </div>
                        `;
                        checkoutItems.appendChild(itemElement);
                    });

                    const shipping = 0;
                    const total = subtotal + shipping;

                    document.getElementById('checkoutSubtotal').textContent = `¥${subtotal.toLocaleString()}`;
                    document.getElementById('checkoutShipping').textContent = `¥${shipping.toLocaleString()}`;
                    document.getElementById('checkoutTotal').textContent = `¥${total.toLocaleString()}`;
                });

            // 合計金額の計算と表示はfetchのコールバック内で実行

            // Stripe Checkout処理
            const stripeCheckoutBtn = document.getElementById('stripeCheckoutBtn');
            
            stripeCheckoutBtn.addEventListener('click', async () => {
                // ボタンを無効化
                stripeCheckoutBtn.disabled = true;
                stripeCheckoutBtn.textContent = '処理中...';
                
                try {
                    // カートデータをStripe Checkout用の形式に変換
                    const lineItems = cart.map(item => ({
                        price_data: {
                            currency: 'jpy',
                            product_data: {
                                name: item.name,
                                description: item.size_name ? `サイズ: ${item.size_name}` : '',
                                images: item.image && !item.image.includes('placeholder.com') ? [item.image] : []
                            },
                            unit_amount: item.price
                        },
                        quantity: item.quantity
                    }));
                    
                    // Stripe Checkout Sessionを作成するAPIを呼び出し
                    const response = await fetch('/api/checkout', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            lineItems: lineItems,
                            successUrl: `${window.location.origin}/checkout-success.html?session_id={CHECKOUT_SESSION_ID}`,
                            cancelUrl: `${window.location.origin}/checkout.html`
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    
                    // Stripe Checkoutにリダイレクト
                    // 注意: 実際のStripe実装では、data.sessionIdを使用してリダイレクト
                    // 現在はプレースホルダーなので、完了ページに直接移動
                    console.log('Stripe Checkout Session作成完了:', data);
                    
                    // TODO: Stripe実装後は以下のように変更
                    // window.location.href = data.url;
                    
                    // カートをクリア（Stripe実装後はStripeからのリダイレクト時にクリアされる）
                    localStorage.removeItem('cart');
                    console.log('カートをクリアしました');
                    
                    // 暫定的に完了ページに移動（Stripe実装まで）
                    alert('Stripe Checkoutの実装が完了次第、決済ページにリダイレクトされます。\n現在は完了ページに移動します。');
                    window.location.href = '/checkout-success.html?order=STRIPE_READY';
                    
                } catch (error) {
                    console.error('Stripe Checkoutエラー:', error);
                    alert(`決済処理の開始中にエラーが発生しました: ${error.message}`);
                    stripeCheckoutBtn.disabled = false;
                    stripeCheckoutBtn.textContent = 'Stripe Checkoutに進む';
                }
            });
        });
    </script>
</body>
</html>
